rule_files:
  - ../prometheus-puppet-exporter.yml

evaluation_interval: 1m

tests:
  - name: Source and retained summary states alert after their hold times
    interval: 1m
    input_series:
      - series: 'puppet_config_up{job="puppet_exporter",instance="config-down"}'
        values: '0x140'
      - series: 'puppet_exporter_last_collection_success{job="puppet_exporter",instance="collection-failed"}'
        values: '0x140'
      - series: 'puppet_config_up{job="puppet_exporter",instance="config-invalid"}'
        values: '1x140'
      - series: 'puppet_config_valid{job="puppet_exporter",instance="config-invalid"}'
        values: '0x140'
      - series: 'puppet_agent_lock_state_up{job="puppet_exporter",instance="lock-down"}'
        values: '0x140'
      - series: 'puppet_agent_lock_state_up{job="puppet_exporter",instance="lock-invalid"}'
        values: '1x140'
      - series: 'puppet_agent_lock_state_valid{job="puppet_exporter",instance="lock-invalid"}'
        values: '0x140'
      - series: 'puppet_last_run_summary_up{job="puppet_exporter",instance="summary-down"}'
        values: '0x140'
      - series: 'puppet_last_run_summary_up{job="puppet_exporter",instance="summary-invalid"}'
        values: '1x140'
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="summary-invalid"}'
        values: '0x140'
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="summary-stale"}'
        values: '1x140'
      - series: 'puppet_last_run_summary_mtime_seconds{job="puppet_exporter",instance="summary-stale"}'
        values: '1x140'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="run-stale"}'
        values: '1x140'
      - series: 'puppet_last_run_timestamp_seconds{job="puppet_exporter",instance="run-stale"}'
        values: '1x140'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="run-failed"}'
        values: '1x140'
      - series: 'puppet_last_run_success{job="puppet_exporter",instance="run-failed"}'
        values: '0x140'
    alert_rule_test:
      - eval_time: 11m
        alertname: PuppetConfigSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: config-down
            exp_annotations:
              summary: Puppet config source is unreadable on config-down
              description: |
                prometheus-puppet-exporter could not read puppet.conf for at least 10 minutes.
      - eval_time: 11m
        alertname: PuppetExporterCollectionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: collection-failed
            exp_annotations:
              summary: Puppet exporter collection failed on collection-failed
              description: |
                prometheus-puppet-exporter has reported unsuccessful background collections for at least 10 minutes.
      - eval_time: 11m
        alertname: PuppetConfigInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: config-invalid
            exp_annotations:
              summary: Puppet config is present but invalid on config-invalid
              description: |
                puppet.conf is readable, but one or more required fields are empty.
      - eval_time: 11m
        alertname: PuppetLockStateSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: lock-down
            exp_annotations:
              summary: Puppet lock state source is unreadable on lock-down
              description: |
                prometheus-puppet-exporter could not read agent_disabled.lock for at least 10 minutes.
      - eval_time: 11m
        alertname: PuppetLockStateInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: lock-invalid
            exp_annotations:
              summary: Puppet lock state source is invalid on lock-invalid
              description: |
                agent_disabled.lock is readable, but prometheus-puppet-exporter cannot parse it.
      - eval_time: 11m
        alertname: PuppetRunSummarySourceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: summary-down
            exp_annotations:
              summary: Puppet run summary source is unreadable on summary-down
              description: |
                prometheus-puppet-exporter could not read last_run_summary.yaml for at least 10 minutes.
      - eval_time: 11m
        alertname: PuppetRunSummaryInvalid
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: summary-invalid
            exp_annotations:
              summary: Puppet run summary source is invalid on summary-invalid
              description: |
                last_run_summary.yaml is readable, but prometheus-puppet-exporter cannot parse or interpret it.
      - eval_time: 2h16m
        alertname: PuppetRunSummaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: summary-stale
            exp_annotations:
              summary: Puppet run summary is stale on summary-stale
              description: |
                last_run_summary.yaml for summary-stale has not been updated for more than 2 hours.
      - eval_time: 2h16m
        alertname: PuppetLastRunStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: run-stale
            exp_annotations:
              summary: Puppet last run is stale on run-stale
              description: |
                The last Puppet run timestamp for run-stale is older than 2 hours.
      - eval_time: 1h1m
        alertname: PuppetLastRunFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: run-failed
            exp_annotations:
              summary: Puppet run is failing on run-failed
              description: |
                The last Puppet run is unsuccessful, or an enabled agent has exposed no numeric catalog version, for at least 1 hour.

  - name: Puppet run problems retain their domain labels and values
    interval: 1m
    input_series:
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="node-1"}'
        values: '1x20'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="node-1"}'
        values: '1x20'
      - series: 'puppet_resources{job="puppet_exporter",instance="node-1",name="failed"}'
        values: '2x20'
      - series: 'puppet_events{job="puppet_exporter",instance="node-1",name="failure"}'
        values: '3x20'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="restart-node"}'
        values: '1x20'
      - series: 'puppet_resources{job="puppet_exporter",instance="restart-node",name="failed_to_restart"}'
        values: '1x20'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="drift-node"}'
        values: '1x20'
      - series: 'puppet_resources{job="puppet_exporter",instance="drift-node",name="out_of_sync"}'
        values: '4x20'
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="invalid-node"}'
        values: '0x20'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="invalid-node"}'
        values: '0x20'
      - series: 'puppet_resources{job="puppet_exporter",instance="invalid-node",name="failed"}'
        values: '5x20'
      - series: 'puppet_events{job="puppet_exporter",instance="invalid-node",name="failure"}'
        values: '4x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: PuppetResourceProblems
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: node-1
              name: failed
            exp_annotations:
              summary: Puppet resource problems on node-1
              description: |
                The latest Puppet run for node-1 reports failed=2.
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: restart-node
              name: failed_to_restart
            exp_annotations:
              summary: Puppet resource problems on restart-node
              description: |
                The latest Puppet run for restart-node reports failed_to_restart=1.
      - eval_time: 16m
        alertname: PuppetEventFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: node-1
              name: failure
            exp_annotations:
              summary: Puppet event failures on node-1
              description: |
                The latest Puppet run for node-1 reports 3 failed events.

  - name: Only stale numeric catalog versions alert
    interval: 1m
    input_series:
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="stale-node"}'
        values: '0x121'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="stale-node"}'
        values: '1x121'
      - series: 'puppet_catalog_version_timestamp_seconds{job="puppet_exporter",instance="stale-node"}'
        values: '1x121'
      - series: 'puppet_last_run_summary_valid{job="puppet_exporter",instance="fresh-node"}'
        values: '1x121'
      - series: 'puppet_last_run_summary_data_available{job="puppet_exporter",instance="fresh-node"}'
        values: '1x121'
      - series: 'puppet_catalog_version_timestamp_seconds{job="puppet_exporter",instance="fresh-node"}'
        values: '7200x121'
    alert_rule_test:
      - eval_time: 2h
        alertname: PuppetCatalogVersionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: stale-node
            exp_annotations:
              summary: Puppet catalog version is stale on stale-node
              description: |
                The Puppet catalog version timestamp for stale-node is older than 1 hour.

  - name: Missing catalog version alerts only for healthy enabled agents
    interval: 1m
    input_series:
      - series: 'puppet_exporter_last_collection_success{job="puppet_exporter",instance="missing-node"}'
        values: '1x70'
      - series: 'puppet_agent_lock_state_valid{job="puppet_exporter",instance="missing-node"}'
        values: '1x70'
      - series: 'puppet_agent_disabled{job="puppet_exporter",instance="missing-node",message=""}'
        values: '0x70'
      - series: 'puppet_exporter_last_collection_success{job="puppet_exporter",instance="disabled-node"}'
        values: '1x70'
      - series: 'puppet_agent_lock_state_valid{job="puppet_exporter",instance="disabled-node"}'
        values: '1x70'
      - series: 'puppet_agent_disabled{job="puppet_exporter",instance="disabled-node",message="maintenance"}'
        values: '1x70'
      - series: 'puppet_exporter_last_collection_success{job="puppet_exporter",instance="unhealthy-node"}'
        values: '0x70'
      - series: 'puppet_agent_lock_state_valid{job="puppet_exporter",instance="unhealthy-node"}'
        values: '1x70'
      - series: 'puppet_agent_disabled{job="puppet_exporter",instance="unhealthy-node",message=""}'
        values: '0x70'
      - series: 'puppet_exporter_last_collection_success{job="puppet_exporter",instance="present-node"}'
        values: '1x70'
      - series: 'puppet_agent_lock_state_valid{job="puppet_exporter",instance="present-node"}'
        values: '1x70'
      - series: 'puppet_agent_disabled{job="puppet_exporter",instance="present-node",message=""}'
        values: '0x70'
      - series: 'puppet_catalog_version_timestamp_seconds{job="puppet_exporter",instance="present-node"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 1h1m
        alertname: PuppetLastRunFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: missing-node
            exp_annotations:
              summary: Puppet run is failing on missing-node
              description: |
                The last Puppet run is unsuccessful, or an enabled agent has exposed no numeric catalog version, for at least 1 hour.

  - name: Stale last-known-good summary data alerts
    interval: 1m
    input_series:
      - series: 'puppet_last_run_summary_data_stale{job="puppet_exporter",instance="fallback-node"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: PuppetRunSummaryLastKnownGoodStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: fallback-node
            exp_annotations:
              summary: Puppet run summary fallback is stale on fallback-node
              description: |
                prometheus-puppet-exporter has not collected a valid last_run_summary.yaml for more than 2 hours.

  - name: Disabled agents and unavailable exporters alert after their hold times
    interval: 1m
    input_series:
      - series: 'puppet_agent_disabled{job="puppet_exporter",instance="disabled-node",message=""}'
        values: '1x20'
      - series: 'up{job="puppet_exporter",instance="down-node"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: PuppetAgentDisabled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: disabled-node
            exp_annotations:
              summary: Puppet agent is disabled on disabled-node
              description: "The Puppet agent on disabled-node is disabled. Message: \n"
      - eval_time: 6m
        alertname: PuppetExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: puppet_exporter
              instance: down-node
            exp_annotations:
              summary: Puppet exporter target is down on down-node
              description: |
                Prometheus has been unable to scrape prometheus-puppet-exporter on down-node for at least 5 minutes.

  - name: Source error counter increases produce diagnostic alerts
    interval: 1m
    input_series:
      - series: 'puppet_config_read_errors_total{job="puppet_exporter",instance="read-node"}'
        values: '0x14 1x16'
      - series: 'puppet_last_run_summary_parse_errors_total{job="puppet_exporter",instance="parse-node"}'
        values: '0x14 1x16'
    alert_rule_test:
      - eval_time: 30m
        alertname: PuppetCollectorReadErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: read-node
            exp_annotations:
              summary: Puppet exporter encountered source read errors on read-node
              description: |
                One or more Puppet exporter sources observed file read/open errors in the last 30 minutes.
      - eval_time: 30m
        alertname: PuppetCollectorParseErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: puppet_exporter
              instance: parse-node
            exp_annotations:
              summary: Puppet exporter encountered source parse errors on parse-node
              description: |
                One or more Puppet exporter sources observed parse/decode errors in the last 30 minutes.
