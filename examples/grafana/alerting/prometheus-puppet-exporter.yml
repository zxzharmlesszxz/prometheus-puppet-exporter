apiVersion: 1

groups:
  - orgId: 1
    name: prometheus-puppet-exporter
    folder: Exporters
    interval: 1m
    rules:
      - uid: ppe-puppet-exporter-down
        title: PuppetExporterDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "up{job=~\"^(prometheus[_-])?puppet[_-]exporter$\"} == 0"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Puppet exporter target is down on {{ $labels.instance }}"
          description: "Prometheus has been unable to scrape prometheus-puppet-exporter on {{ $labels.instance }} for at least 5 minutes.\n"
        labels:
          severity: critical
        isPaused: false
