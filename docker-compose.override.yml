services:
  exporter:
    command:
      - --web.listen-address=:${COMPOSE_EXPORTER_PORT:-9819}
      - --${FEATURE_NAME}.refresh-interval=30s
      - --${FEATURE_NAME}.config-path=/testdata/puppet.conf
      - --${FEATURE_NAME}.lock-path=/testdata/agent_disabled.lock
      - --${FEATURE_NAME}.summary-path=/testdata/last_run_summary.yaml
    volumes:
      - ./testdata:/testdata:ro
