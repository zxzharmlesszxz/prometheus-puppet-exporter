services:
  exporter:
    command:
      - --web.listen-address=:9819
      - --${FEATURE_NAME:-puppet}.refresh-interval=30s
      - --${FEATURE_NAME:-puppet}.config-path=/testdata/puppet.conf
      - --${FEATURE_NAME:-puppet}.lock-path=/testdata/agent_disabled.lock
      - --${FEATURE_NAME:-puppet}.summary-path=/testdata/last_run_summary.yaml
    volumes:
      - ./testdata:/testdata:ro
